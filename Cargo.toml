[package]
name = "mongo2pg"
version = "0.8.1"
edition = "2021"
description = "Schema inference and conversion tool: MongoDB → JSON Schema variants"
license = "Apache-2.0"

[lib]
name = "mongo2pg"
path = "src/lib.rs"

[[bin]]
name = "mongo2pg"
path = "src/bin/mongo2pg.rs"

[dependencies]
mongodb = "3.9.1"
tokio = { version = "1.53.2", features = ["full"] }
native-tls = "0.2.18"
postgres-native-tls = "0.5.3"
tokio-postgres = "0.7.18"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.153"
serde_yaml = "0.9.34"
bson = { version = "2.15.0", features = ["chrono-0_4"] }
clap = { version = "4.6.7", features = ["derive"] }
indexmap = { version = "2.14.2", features = ["serde"] }
rand = { version = "0.8.8", features = ["small_rng"] }
anyhow = "1.0.104"
futures = "0.3.34"
chrono = { version = "0.4.45", features = ["serde"] }
flate2 = "1.1.10"
bytes = "1.12.1"
toml = "0.9.12"
strsim = "0.11.1"
rdkafka = { version = "0.39.0", features = ["ssl-vendored"] }
reqwest = { version = "0.12.28", default-features = false, features = [
    "json",
    "rustls-tls",
] }
apache-avro = "0.22.0"
env_logger = "0.11.11"
log = "0.4.34"
google-cloud-auth = "1.17.0"
google-cloud-storage = "1.20.0"
rustls = { version = "0.23.45", features = ["ring"] }
tempfile = "3.27.0"

md5 = "0.8.1"
json5 = "1.3.1"

[dev-dependencies]
indoc = "2.0.8"
postgres = "0.19.14"
rstest = "0.26.1"
testcontainers = "0.27.3"
testcontainers-modules = { version = "0.15.0", features = [
    "postgres",
    "mongo",
] }
tokio = { version = "1.53.2", features = ["full"] }
tokio-postgres = { version = "0.7.18", features = ["with-chrono-0_4"] }
