[package]
name = "mongo2pg"
version = "0.6.5"
edition = "2021"
description = "Schema inference and conversion tool: MongoDB → JSON Schema variants"
license = "Apache-2.0"

[lib]
name = "mongo2pg"
path = "src/lib.rs"

[[bin]]
name = "mongo2pg"
path = "src/bin/mongo2pg.rs"

[dependencies]
mongodb = "3.8.0"
tokio = { version = "1.52.3", features = ["full"] }
native-tls = "0.2.18"
postgres-native-tls = "0.5.3"
tokio-postgres = "0.7.18"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
serde_yaml = "0.9.33"
bson = { version = "2.15.0", features = ["chrono-0_4"] }
clap = { version = "4.6.2", features = ["derive"] }
indexmap = { version = "2.14.0", features = ["serde"] }
rand = { version = "0.8.7", features = ["small_rng"] }
anyhow = "1.0.103"
futures = "0.3.32"
chrono = { version = "0.4.45", features = ["serde"] }
flate2 = "1.1.9"
bytes = "1.12.1"
toml = "0.9.8"
strsim = "0.11.1"
rdkafka = { version = "0.39.0", features = ["ssl-vendored"] }
reqwest = { version = "0.12.28", default-features = false, features = [
    "json",
    "rustls-tls",
] }
apache-avro = "0.21.0"
env_logger = "0.11.11"
log = "0.4.33"
google-cloud-auth = "1.14.0"
google-cloud-storage = "1.16.0"
rustls = { version = "0.23.42", features = ["ring"] }
tempfile = "3.27.0"

md5 = "0.8.1"

[dev-dependencies]
indoc = "2.0.7"
postgres = "0.19.14"
rstest = "0.26.1"
testcontainers = "0.27.3"
testcontainers-modules = { version = "0.15.0", features = [
    "postgres",
    "mongo",
] }
tokio = { version = "1.52.3", features = ["full"] }
tokio-postgres = { version = "0.7.18", features = ["with-chrono-0_4"] }
