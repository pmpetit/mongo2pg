[package]
name = "mongo2pg"
version = "0.7.0"
edition = "2021"
description = "Schema inference and conversion tool: MongoDB → JSON Schema variants"
license = "Apache-2.0"

[lib]
name = "mongo2pg"
path = "src/lib.rs"

[[bin]]
name = "mongo2pg"
path = "src/bin/mongo2pg.rs"

[dependencies]
mongodb = "3.6.0"
tokio = { version = "1", features = ["full"] }
native-tls = "0.2"
postgres-native-tls = "0.5"
tokio-postgres = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
bson = { version = "2", features = ["chrono-0_4"] }
clap = { version = "4", features = ["derive"] }
indexmap = { version = "2", features = ["serde"] }
rand = { version = "0.8", features = ["small_rng"] }
anyhow = "1"
futures = "0.3"
chrono = { version = "0.4", features = ["serde"] }
flate2 = "1"
bytes = "1"
toml = "0.8"
strsim = "0.11.1"
rdkafka = { version = "0.36" }
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
] }
apache-avro = "0.17"
env_logger = "0.11"
log = "0.4"
google-cloud-auth = "1.13.0"
google-cloud-storage = "1.15.0"
rustls = { version = "0.23", features = ["ring"] }
tempfile = "3.27.0"

md5 = "0.7"

[dev-dependencies]
indoc = "2.0.7"
postgres = "0.19.14"
rstest = "0.26.1"
testcontainers = "0.27.1"
testcontainers-modules = { version = "0.15.0", features = [
    "postgres",
    "mongo",
] }
tokio = { version = "1", features = ["full"] }
tokio-postgres = { version = "0.7.10", features = ["with-chrono-0_4"] }
