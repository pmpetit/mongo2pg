services:
  # --- POSTGRESQL ---
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: postgres_db
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: x
      POSTGRES_DB: mydb
    ports:
      - "5432:5432"
    # volumes:
    #   - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myuser -d mydb"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- MONGODB (Replica Set Setup) ---
  mongodb:
    image: mongodb/mongodb-community-server
    container_name: mongodb_db
    entrypoint: ["/bin/sh", "/usr/local/bin/mongodb-entrypoint.sh"]
    command:
      [
        "mongod",
        "--quiet",
        "--replSet",
        "rs0",
        "--bind_ip_all",
        "--keyFile",
        "/tmp/mongodb-keyfile",
      ]
    environment:
      MONGODB_INITDB_ROOT_USERNAME: user
      MONGODB_INITDB_ROOT_PASSWORD: pass
      MONGO_REPLICA_SET_KEY: mongo2pgdevkey
    ports:
      - "27017:27017"
    volumes:
      #- mongo_data:/data/db
      - ./mongodb-entrypoint.sh:/usr/local/bin/mongodb-entrypoint.sh:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'echo ''db.runCommand("ping").ok'' | mongosh ''mongodb://user:pass@localhost:27017/admin?authSource=admin'' --quiet',
        ]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 20s

  # --- MONGO INIT (Automatically starts the replica set) ---
  mongodb-init:
    image: mongodb/mongodb-community-server
    container_name: mongodb_init
    depends_on:
      mongodb:
        condition: service_healthy
    entrypoint:
      [
        "mongosh",
        "--host",
        "mongodb:27017",
        "-u",
        "user",
        "-p",
        "pass",
        "--authenticationDatabase",
        "admin",
        "--eval",
        "try { rs.status(); } catch (e) { rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'mongodb:27017'}]}); }",
      ]

  # --- MONGO SAMPLE DATA SEEDING ---
  mongodb-seed:
    image: mongodb/mongodb-community-server
    container_name: mongodb_seed
    user: root
    environment:
      MONGO_DATABASE: ${MONGO_DATABASE:-}
    depends_on:
      mongodb-init:
        condition: service_completed_successfully
    entrypoint:
      - /bin/bash
      - -lc
      - |
        set -euo pipefail

        echo 'Waiting for MongoDB primary...'
        # Loop until the replica set has a primary member
        until mongosh 'mongodb://user:pass@mongodb:27017/admin?authSource=admin&replicaSet=rs0' --quiet --eval 'db.isMaster().ismaster' | grep -q 'true'; do
          echo -n '.'
          sleep 2
        done
        echo ' MongoDB primary is UP!'

        # Install dependencies and run the seeding script
        echo 'Seeding MongoDB with sample data...'
        apt-get update && \
        apt-get install -y --no-install-recommends git ca-certificates && \
        rm -rf /var/lib/apt/lists/* && \
        rm -rf /tmp/mongodb-sample-dataset && \
        git clone --depth 1 https://github.com/neelabalan/mongodb-sample-dataset /tmp/mongodb-sample-dataset && \
        cd /tmp/mongodb-sample-dataset

        if [ -n "$$MONGO_DATABASE" ]; then
          if [ ! -d "$$MONGO_DATABASE" ]; then
            echo "Dataset '$$MONGO_DATABASE' not found"
            echo "Available datasets:"
            ls -1d */ | sed 's#/$$##'
            exit 1
          fi
          db_dirs="$$MONGO_DATABASE"
          echo "Seeding only dataset: $$MONGO_DATABASE"
        else
          db_dirs=$$(find . -mindepth 1 -maxdepth 1 -type d -printf '%f\n')
          echo "Seeding all datasets"
        fi

        imported_count=0
        for directory in $$db_dirs; do
          db_name="$$(basename "$$directory")"
          echo "Seeding database: $$db_name"
          json_count=$$(find "$$directory" -maxdepth 1 -type f -name '*.json' | wc -l | tr -d '[:space:]')
          if [ "$$json_count" -eq 0 ]; then
            echo "No JSON files found in $$directory"
            continue
          fi

          while IFS= read -r data_file; do
            collection_name="$$(basename "$$data_file" .json)"
            mongoimport --drop --host mongodb --port 27017 --db "$$db_name" --collection "$$collection_name" --file "$$data_file" --authenticationDatabase admin -u user -p pass
            ((imported_count += 1))
          done < <(find "$$directory" -maxdepth 1 -type f -name '*.json' | sort)
        done

        if (( imported_count == 0 )); then
          echo "Seeding finished but 0 collections were imported"
          exit 1
        fi

        if [ -n "$$MONGO_DATABASE" ]; then
          has_collections=$$(mongosh 'mongodb://user:pass@mongodb:27017/admin?authSource=admin&replicaSet=rs0' --quiet --eval "db.getSiblingDB('$$MONGO_DATABASE').getCollectionNames().length > 0" | tr -d '\r\n[:space:]')
          if [ "$$has_collections" != "true" ]; then
            echo "Seeding finished but database '$$MONGO_DATABASE' is empty"
            exit 1
          fi
        fi

        echo "Seeding completed: imported $$imported_count collection file(s)"

  # --- MONGO SAMPLE DATA SEEDING (LOCAL e2e DATASET) ---
  mongodb-seed-e2e:
    image: mongodb/mongodb-community-server
    container_name: mongodb_seed_e2e
    user: root
    profiles: ["e2e-local-seed"]
    environment:
      MONGO_DATABASE: ${MONGO_DATABASE:-}
    volumes:
      - ../e2e_tests/data:/seed-data:ro
    depends_on:
      mongodb-init:
        condition: service_completed_successfully
    entrypoint:
      - /bin/bash
      - -lc
      - |
        set -euo pipefail

        echo 'Waiting for MongoDB primary...'
        until mongosh 'mongodb://user:pass@mongodb:27017/admin?authSource=admin&replicaSet=rs0' --quiet --eval 'db.isMaster().ismaster' | grep -q 'true'; do
          echo -n '.'
          sleep 2
        done
        echo ' MongoDB primary is UP!'

        seed_root="/seed-data"
        if [ ! -d "$$seed_root" ]; then
          echo "Seed folder '$$seed_root' not found"
          exit 0
        fi

        if [ -n "$$MONGO_DATABASE" ]; then
          if [ ! -d "$$seed_root/$$MONGO_DATABASE" ]; then
            echo "Local e2e dataset '$$MONGO_DATABASE' not found under $$seed_root; skipping local e2e seed for this database (standard seeding already handled by mongodb-seed)."
            echo "Available local e2e datasets:"
            find "$$seed_root" -mindepth 1 -maxdepth 1 -type d -name 'sample*' -printf '%f\n' | sort || true
            exit 0
          fi
          db_dirs="$$seed_root/$$MONGO_DATABASE"
          echo "Seeding only dataset: $$MONGO_DATABASE"
        else
          db_dirs=$$(find "$$seed_root" -mindepth 1 -maxdepth 1 -type d -name 'sample*' | sort)
          if [ -z "$$db_dirs" ]; then
            echo "No sample* datasets found under $$seed_root"
            exit 0
          fi
          echo "Seeding all local sample* datasets"
        fi

        imported_count=0
        for directory in $$db_dirs; do
          db_name="$$(basename "$$directory")"
          echo "Seeding database: $$db_name"
          json_count=$$(find "$$directory" -maxdepth 1 -type f -name '*.json' | wc -l | tr -d '[:space:]')
          if [ "$$json_count" -eq 0 ]; then
            echo "No JSON files found in $$directory"
            continue
          fi

          while IFS= read -r data_file; do
            collection_name="$$(basename "$$data_file" .json)"
            mongoimport --drop --host mongodb --port 27017 --db "$$db_name" --collection "$$collection_name" --file "$$data_file" --authenticationDatabase admin -u user -p pass
            ((imported_count += 1))
          done < <(find "$$directory" -maxdepth 1 -type f -name '*.json' | sort)
        done

        if (( imported_count == 0 )); then
          echo "Seeding finished but 0 collections were imported"
          exit 0
        fi

        echo "Seeding completed (e2e local): imported $$imported_count collection file(s)"

  # --- APACHE KAFKA (KRaft Mode - No Zookeeper) ---
  kafka:
    image: confluentinc/cp-kafka:8.2.1
    container_name: kafka_broker
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092"
      KAFKA_OFFERS_LISTENERS: "PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092"
      KAFKA_OFFER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:29093"
      KAFKA_NUM_PARTITIONS: "4"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qg" # Pre-generated cluster ID
    # volumes:
    #   - kafka_data:/var/lib/kafka/data
    healthcheck:
      test:
        [
          "CMD",
          "kafka-topics",
          "--bootstrap-server",
          "localhost:29092",
          "--list",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- KAFKA TOPIC INIT (Ensure Schema Registry topic shape) ---
  kafka-topics-init:
    image: confluentinc/cp-kafka:8.2.1
    container_name: kafka_topics_init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint:
      - /bin/bash
      - -lc
      - |
        set -euo pipefail
        echo "Ensuring _schemas topic exists with 1 partition..."
        kafka-topics --bootstrap-server kafka:29092 --delete --topic _schemas >/dev/null 2>&1 || true
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic _schemas --partitions 1 --replication-factor 1 --config cleanup.policy=compact
        kafka-topics --bootstrap-server kafka:29092 --describe --topic _schemas
        echo "_schemas topic ready."

  # --- CONFLUENT SCHEMA REGISTRY ---
  schema-registry:
    image: confluentinc/cp-schema-registry:8.2.1
    container_name: schema_registry
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: "PLAINTEXT://kafka:29092"
      SCHEMA_REGISTRY_HOST_NAME: "schema-registry"
      SCHEMA_REGISTRY_LISTENERS: "http://0.0.0.0:8081"
    depends_on:
      kafka:
        condition: service_healthy
      kafka-topics-init:
        condition: service_completed_successfully

  # --- KAFKA CONNECT / DEBEZIUM WITH CONFLUENT AVRO CONVERTERS ---
  kafkaconnect:
    build:
      context: .
      dockerfile: Dockerfile.kafkaconnect
    container_name: kafka_connect
    ports:
      - "8083:8083"
    environment:
      CONNECT_BOOTSTRAP_SERVERS: "kafka:29092"
      CONNECT_GROUP_ID: "1"
      CONNECT_CONFIG_STORAGE_TOPIC: "debezium_connect_configs"
      CONNECT_OFFSET_STORAGE_TOPIC: "debezium_connect_offsets"
      CONNECT_STATUS_STORAGE_TOPIC: "debezium_connect_statuses"
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: "1"
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: "1"
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: "1"
      CONNECT_KEY_CONVERTER: "io.confluent.connect.avro.AvroConverter"
      CONNECT_VALUE_CONVERTER: "io.confluent.connect.avro.AvroConverter"
      CONNECT_KEY_CONVERTER_SCHEMA_REGISTRY_URL: "http://schema-registry:8081"
      CONNECT_VALUE_CONVERTER_SCHEMA_REGISTRY_URL: "http://schema-registry:8081"
      CONNECT_INTERNAL_KEY_CONVERTER: "io.confluent.connect.avro.AvroConverter"
      CONNECT_INTERNAL_VALUE_CONVERTER: "io.confluent.connect.avro.AvroConverter"
      CONNECT_INTERNAL_KEY_CONVERTER_SCHEMAS_ENABLE: "true"
      CONNECT_INTERNAL_VALUE_CONVERTER_SCHEMAS_ENABLE: "true"
      CONNECT_REST_ADVERTISED_HOST_NAME: "kafkaconnect"
      CONNECT_REST_PORT: "8083"
      CONNECT_PLUGIN_PATH: "/usr/share/java,/usr/share/confluent-hub-components,/kafka/connect"
    depends_on:
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_started
      mongodb-init:
        condition: service_completed_successfully

  kafkaconnect-init:
    image: curlimages/curl:8.8.0
    container_name: kafka_connect_init
    depends_on:
      kafkaconnect:
        condition: service_started
      mongodb-seed:
        condition: service_completed_successfully
    entrypoint:
      - sh
      - -lc
      - |
        echo "Waiting for Kafka Connect to be available..."
        until curl -fsS http://kafkaconnect:8083/connectors; do
          sleep 2
        done

        echo "Kafka Connect is up. Creating Debezium MongoDB connector..."
        curl -fsS -X PUT \
          -H 'Content-Type: application/json' \
          http://kafkaconnect:8083/connectors/mongodb2pg/config \
          -d '{
            "connector.class": "io.debezium.connector.mongodb.MongoDbConnector",
            "tasks.max": "1",
            "mongodb.connection.string": "mongodb://user:pass@mongodb:27017/?replicaSet=rs0&authSource=admin",
            "topic.prefix": "t4",
            "topic.creation.default.partitions": "4",
            "topic.creation.default.replication.factor": "1",
            "snapshot.mode": "initial"            
          }'
        echo "\nConnector created successfully."

  # --- KAFKA UI ---
  kafkaui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka_ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: "local"
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: "kafka:29092"
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: "http://schema-registry:8081"
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_NAME: "connect"
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_ADDRESS: "http://kafkaconnect:8083"
    depends_on:
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_started
      kafkaconnect:
        condition: service_started

