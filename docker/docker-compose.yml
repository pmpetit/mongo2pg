services:
  # --- POSTGRESQL ---
  postgres:
    image: postgres:16-alpine
    container_name: postgres_db
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: x
      POSTGRES_DB: mydb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myuser -d mydb"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- MONGODB (Replica Set Setup) ---
  mongodb:
    image: mongodb/mongodb-community-server
    container_name: mongodb_db
    entrypoint: ["/bin/sh", "/usr/local/bin/mongodb-entrypoint.sh"]
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all", "--keyFile", "/tmp/mongodb-keyfile"]
    environment:
      MONGODB_INITDB_ROOT_USERNAME: user
      MONGODB_INITDB_ROOT_PASSWORD: pass
      MONGO_REPLICA_SET_KEY: mongo2pgdevkey
    ports:
      - "2717:27017"
    volumes:
      - mongo_data:/data/db
      - ./mongodb-entrypoint.sh:/usr/local/bin/mongodb-entrypoint.sh:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "echo 'db.runCommand(\"ping\").ok' | mongosh 'mongodb://user:pass@localhost:27017/admin?authSource=admin' --quiet",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- MONGO INIT (Automatically starts the replica set) ---
  mongodb-init:
    image: mongodb/mongodb-community-server
    container_name: mongodb_init
    depends_on:
      mongodb:
        condition: service_healthy
    entrypoint:
      [
        "mongosh",
        "--host",
        "mongodb:27017",
        "-u",
        "user",
        "-p",
        "pass",
        "--authenticationDatabase",
        "admin",
        "--eval",
        "rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'mongodb:27017'}]})",
      ]

  # --- APACHE KAFKA (KRaft Mode - No Zookeeper) ---
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: kafka_broker
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092"
      KAFKA_OFFERS_LISTENERS: "PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092"
      KAFKA_OFFER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:29093"
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk" # Pre-generated cluster ID
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test:
        [
          "CMD",
          "kafka-topics",
          "--bootstrap-server",
          "localhost:29092",
          "--list",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- APICURIO SCHEMA REGISTRY ---
  schema-registry:
    image: apicurio/apicurio-registry-mem:2.5.7.Final
    container_name: schema_registry
    ports:
      - "8080:8080"
    environment:
      QUARKUS_PROFILE: "prod"
    depends_on:
      kafka:
        condition: service_healthy

volumes:
  postgres_data:
  mongo_data:
  kafka_data:
