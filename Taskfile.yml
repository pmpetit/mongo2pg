version: "3"

vars:
  URI: "mongodb://user:pass@localhost:2717/?authSource=admin"
  RESULTS_DIR: results
  BIN: "{{.ROOT_DIR}}/target/debug/mongo2pg"
  DATABASES: >-
    sample_analytics
    sample_airbnb
    sample_geospatial
    sample_mflix
    sample_supplies
    sample_training
    sample_weatherdata

tasks:
  build:
    desc: Build the mongo2pg binary (debug)
    cmds:
      - cargo build
    sources:
      - src/**/*.rs
      - Cargo.toml
      - Cargo.lock
    generates:
      - target/debug/mongo2pg

  infer:
    desc: Infer schemas for all sample databases, generate SQL DDL into {{.RESULTS_DIR}}/infer/
    silent: true
    deps: [build]
    vars:
      OUT: "{{.RESULTS_DIR}}/infer"
    cmds:
      - mkdir -p "{{.OUT}}"
      - |
        for db in {{.DATABASES}}
        do
          echo "📁 init $db"
          "{{.BIN}}" init --project-base "{{.OUT}}" --project-name "$db" --source-uri "{{.URI}}"
          echo "📐 infer $db"
          "{{.BIN}}" infer --source-uri "{{.URI}}" -c "{{.OUT}}/$db/config/$db.toml" --no-output 2>/dev/null
        done
      - echo "👉 results in {{.OUT}}"

  infer-with-jsonb:
    desc: Infer schemas with --jsonb 🪆, generate SQL DDL and HTML report into {{.RESULTS_DIR}}/infer-with-jsonb/
    silent: true
    deps: [build]
    vars:
      OUT: "{{.RESULTS_DIR}}/infer-with-jsonb"
    cmds:
      - mkdir -p "{{.OUT}}"
      - |
        for db in {{.DATABASES}}
        do
          echo "📁 init $db"
          "{{.BIN}}" init --project-base "{{.OUT}}" --project-name "$db" --source-uri "{{.URI}}"
          echo "📐 infer $db"
          "{{.BIN}}" infer --source-uri "{{.URI}}" -c "{{.OUT}}/$db/config/$db.toml" --jsonb --no-output 2>/dev/null
        done
      - echo "👉 results in {{.OUT}}"

  make-tutorial:
    desc: Create tutorial schemas
    silent: true
    deps: [build]
    vars:
      OUT: "tutorial/base"
      DB: "retail"
    cmds:
      - |
        echo "📁 init {{.DB}}"
        "{{.BIN}}" init --project-base "{{.OUT}}" --project-name "{{.DB}}" --source-uri "{{.URI}}"
        echo "📐 infer {{.DB}}"
        "{{.BIN}}" infer --source-uri "{{.URI}}" -c "{{.OUT}}/{{.DB}}/config/{{.DB}}.toml" --jsonb --no-output 2>/dev/null

  tests-all:
    desc: Infer/export/Import for all sample databases
    silent: true
    deps: [build]
    vars:
      OUT: "{{.RESULTS_DIR}}"
      DBS_TO_PROCESS: '{{if .CLI_ARGS}}{{join " " .CLI_ARGS}}{{else}}{{.DATABASES}}{{end}}'
    cmds:
      - mkdir -p "{{.OUT}}"
      - |
        for db in {{.DBS_TO_PROCESS}}
        do
          echo "🗑️  database $db"
          psql -U myuser -d mydb -h localhost -c "DROP DATABASE IF EXISTS $db"
          echo "📁 init $db"
          "{{.BIN}}" init --project-base "{{.OUT}}" --project-name "$db" --source-uri "{{.URI}}"
          echo "⚙️  config $db"
          cp docker/localhost.toml "{{.OUT}}/$db/config/$db.toml"
          echo "📐 infer $db"
          "{{.BIN}}" infer -c "{{.OUT}}/$db/config/$db.toml" --project-dir $db --namespace $db --database-name $db --schema-name $db --no-output
          echo "🍃 ➡️ 📄 export $db"
          "{{.BIN}}" export -c "{{.OUT}}/$db/config/$db.toml" --project-dir $db --namespace $db --database-name $db --schema-name $db
          echo "📄 ➡️ 🐘 import $db"
          "{{.BIN}}" import -c "{{.OUT}}/$db/config/$db.toml" --project-dir $db --namespace $db --database-name $db --schema-name $db
        done
      - echo "👉 results in {{.OUT}}"

  tests-kafka-all:
    desc: kafka-import for all sample databases
    silent: true
    deps: [build]
    vars:
      OUT: "{{.RESULTS_DIR}}"
      DBS_TO_PROCESS: '{{if .CLI_ARGS}}{{join " " .CLI_ARGS}}{{else}}{{.DATABASES}}{{end}}'
    cmds:
      - mkdir -p "{{.OUT}}"
      - |
        for db in {{.DBS_TO_PROCESS}}
        do
          echo "🗑️  database $db"
          psql -U myuser -d mydb -h localhost -c "DROP DATABASE IF EXISTS $db"
          echo "📁 init $db"
          "{{.BIN}}" init --project-base "{{.OUT}}" --project-name "$db" --source-uri "{{.URI}}"
          echo "⚙️  config $db"
          cp docker/localhost.toml "{{.OUT}}/$db/config/$db.toml"
          echo "📐 infer $db"
          "{{.BIN}}" infer -c "{{.OUT}}/$db/config/$db.toml" --project-dir $db --namespace $db --database-name $db --schema-name $db --no-output        
          echo "🗄️ ➔ 🔍 ➔ 🪵 ➔ 🐘 kafka import $db"
          "{{.BIN}}" kafka-import -c "{{.OUT}}/$db/config/$db.toml" --group-id "$db-group" --topic-prefix "mongo2pg.$db" --project-dir $db --database-name $db --schema-name $db
        done
      - echo "👉 results in {{.OUT}}"