              -H "Authorization: Bearer ${{ github.token }}" \
              -H "Accept: application/vnd.github+json" \
              "${api_url}")"

            if command -v jq >/dev/null 2>&1; then
              asset_url="$(printf '%s' "${release_json}" | jq -r --arg asset "${ASSET_NAME}" '.assets[] | select(.name == $asset) | .url' || true)"
            else
              asset_url="$(printf '%s' "${release_json}" | tr -d '\n' | sed -n 's/.*"name"[[:space:]]*:[[:space:]]*"'"${ASSET_NAME}"'"[^}]*"url"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p')"
            fi

            if [ -z "${asset_url}" ] || [ "${asset_url}" = "null" ]; then
              return 1
            fi

            curl -fsSL \
              -H "Authorization: Bearer ${{ github.token }}" \
              -H "Accept: application/octet-stream" \
              "${asset_url}" \
              -o "${DOWNLOAD_DIR}/${ASSET_NAME}"
