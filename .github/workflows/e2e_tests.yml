          chmod +x target/debug/mongo2pg
          target/debug/mongo2pg --version

      - name: Start Docker services (MongoDB, Kafka, Kafka Connect, Kafka UI)
        run: |
          cd docker
          dc() { docker compose "$@"; }
          if ! docker compose version >/dev/null 2>&1; then
            dc() { docker-compose "$@"; }
          fi

          dc -f docker-compose.yml pull || true
          dc -f docker-compose.yml up -d mongodb mongodb-init kafka schema-registry

          for service in mongodb:27017 kafka:29092; do
            for i in {1..60}; do
              case $service in
                mongodb:27017)
                  if docker exec mongodb_db mongosh 'mongodb://user:pass@localhost:27017/admin?authSource=admin' --eval 'db.runCommand({ping: 1})' --quiet 2>/dev/null; then
                    echo "MongoDB is ready"
                    break
                  fi
                  ;;
                kafka:29092)
                  if docker exec kafka_broker kafka-topics --bootstrap-server localhost:29092 --list >/dev/null 2>&1; then
                    echo "Kafka is ready"
                    break
                  fi
                  ;;
              esac
              echo "Waiting for services... ($i/60)"
              sleep 5
            done
          done

          dc -f docker-compose.yml up mongodb-seed
          dc -f docker-compose.yml up mongodb-seed-e2e

      - name: Run mongo2pg grouped online tests
        run: task tests-kafka-all-grouped -- ${{ join(fromJSON(needs.prepare-matrix-grouped.outputs.database_groups), ' ') }}

      - name: Validate grouped post-import report tabs
        shell: bash
        run: |
          set -euo pipefail

          DBS="${{ join(fromJSON(needs.prepare-matrix-grouped.outputs.database_groups), ' ') }}"
          FOUND_REPORTS=0
          for db in ${DBS}; do
            REPORT_PATH="results/local_project/reports/post_report_${db}.html"
            if [ ! -f "${REPORT_PATH}" ]; then
              echo "Expected post-import report not found at ${REPORT_PATH}"
              exit 1
            fi
            FOUND_REPORTS=$((FOUND_REPORTS + 1))
          done

          if [ "${FOUND_REPORTS}" -lt 2 ]; then
            echo "Expected reports for at least two databases, found ${FOUND_REPORTS}."
            exit 1
          fi

          echo "Grouped post-import report validation passed (${FOUND_REPORTS} reports found)."

      - name: Upload grouped report artifact on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: grouped-online-post-import-report
          path: |
            results/**/reports/post_report*.html
            results/**/reports/main.html
            results/**/config/local_project.toml
            results/**/reports/kafka_import_write_mode.stats.yaml
          if-no-files-found: warn

      - name: Cleanup
        if: always()
        run: |
          cd docker
          dc() { docker compose "$@"; }
          if ! docker compose version >/dev/null 2>&1; then
            dc() { docker-compose "$@"; }
          fi
          dc -f docker-compose.yml down -v || true
