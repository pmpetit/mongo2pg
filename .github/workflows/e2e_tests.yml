      - name: Make mongo2pg binary executable
        if: ${{ inputs.release_tag == '' }}
        run: chmod +x target/debug/mongo2pg

      - name: Install Task
        uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Ensure PostgreSQL client is available
        shell: bash
        run: |
          set -euo pipefail

          if command -v psql >/dev/null 2>&1; then
            echo "psql already available: $(psql --version)"
            exit 0
          fi

