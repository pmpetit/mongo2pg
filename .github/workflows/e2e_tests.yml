                --dir "${DOWNLOAD_DIR}"
            else
              gh release download "${RELEASE_TAG}" \
                --repo "${{ github.repository }}" \
                --pattern "${ASSET_NAME}" \
                --dir "${DOWNLOAD_DIR}"
            fi
