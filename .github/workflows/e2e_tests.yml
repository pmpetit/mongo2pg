            RELEASE_TAG="${REQUESTED_RELEASE_TAG}"
            RELEASE_ENDPOINT="tags/${RELEASE_TAG}"
          else
            RELEASE_TAG="latest"
            RELEASE_ENDPOINT="latest"
          fi
          CUSTOM_RELEASE_TAG_REQUIRED=false
          if [ -n "${REQUESTED_RELEASE_TAG}" ]; then
            CUSTOM_RELEASE_TAG_REQUIRED=true
          fi

          echo "Using mongo2pg release tag: ${RELEASE_TAG}"

          DOWNLOAD_DIR=/tmp/mongo2pg-release-bin
          ASSET_NAME=mongo2pg-linux-x86_64.tar.gz
