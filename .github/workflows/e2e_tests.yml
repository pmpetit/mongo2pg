name: e2e tests

permissions:
  contents: read

env:
  PGPASSWORD: x
  TOPIC_PREFIX: t4
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  PRE_RELEASE_TAG: latest
  DEFAULT_DATABASES_JSON: '["sample_analytics","sample_airbnb","sample_geospatial","sample_mflix","sample_supplies","sample_training","sample_weatherdata", "sam"]'

on:
  workflow_call:
    inputs:
      database:
        description: Database list to test
        required: false
        type: string
        default: "sample_analytics"
      release_tag:
        description: GitHub Release tag to use for mongo2pg binary.
        required: false
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      database:
        description: "Database list to test (supports newline, space, or comma separated values)"
        required: true
        type: string
        default: "sample_analytics"
      release_tag:
        description: "GitHub Release tag to use for mongo2pg binary (optional, supports prerelease tags)"
        required: false
        type: string
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare-matrix:
    name: Prepare database matrix
    runs-on: [self-hosted, Linux, X64, stable]
    outputs:
      database_groups: ${{ steps.build.outputs.database_groups }}
      databases_cli: ${{ steps.build.outputs.databases_cli }}
      database_count: ${{ steps.build.outputs.database_count }}
    steps:
      - name: Build matrix payload
        id: build
        shell: bash
        run: |
          set -euo pipefail

          INPUT_DATABASES="${{ inputs.database || github.event.inputs.database || '' }}"

          if [ -z "${INPUT_DATABASES}" ]; then
            DATABASES_JSON="${DEFAULT_DATABASES_JSON}"
          else
            DATABASES_JSON="$(printf '%s' "${INPUT_DATABASES}" \
            | tr ',\n\t' '   ' \
            | xargs -n1 \
            | sed '/^$/d' \
            | jq -R -s -c 'split("\n") | map(select(length > 0))')"

            if [ "${DATABASES_JSON}" = "[]" ]; then
              DATABASES_JSON="${DEFAULT_DATABASES_JSON}"
            fi
          fi

          DATABASE_GROUPS_JSON="$(printf '%s' "${DATABASES_JSON}" \
            | jq -c 'map(.)')"
          DATABASES_CLI="$(printf '%s' "${DATABASES_JSON}" | jq -r 'join(" ")')"
          DATABASE_COUNT="$(printf '%s' "${DATABASES_JSON}" | jq -r 'length')"

          echo "database_groups=${DATABASE_GROUPS_JSON}" >> "$GITHUB_OUTPUT"
          echo "databases_cli=${DATABASES_CLI}" >> "$GITHUB_OUTPUT"
          echo "database_count=${DATABASE_COUNT}" >> "$GITHUB_OUTPUT"

  prepare-matrix-grouped:
    name: Prepare grouped database matrix
    runs-on: [self-hosted, Linux, X64, stable]
    outputs:
      database_groups: ${{ steps.build.outputs.database_groups }}
      database_count: ${{ steps.build.outputs.database_count }}
    steps:
      - name: Build grouped matrix payload
        id: build
        shell: bash
        run: |
          set -euo pipefail

          INPUT_DATABASES="${{ inputs.database || github.event.inputs.database || '' }}"

          if [ -z "${INPUT_DATABASES}" ]; then
            DATABASES_JSON="${DEFAULT_DATABASES_JSON}"
          else
            DATABASES_JSON="$(printf '%s' "${INPUT_DATABASES}" \
            | tr ',\n\t' '   ' \
            | xargs -n1 \
            | sed '/^$/d' \
            | jq -R -s -c 'split("\n") | map(select(length > 0))')"

            if [ "${DATABASES_JSON}" = "[]" ]; then
              DATABASES_JSON="${DEFAULT_DATABASES_JSON}"
            fi
          fi

          DATABASE_GROUPS_JSON="$(printf '%s' "${DATABASES_JSON}" | jq -c 'map(.)')"
          DATABASE_COUNT="$(printf '%s' "${DATABASES_JSON}" | jq -r 'length')"

          echo "database_groups=${DATABASE_GROUPS_JSON}" >> "$GITHUB_OUTPUT"
          echo "database_count=${DATABASE_COUNT}" >> "$GITHUB_OUTPUT"

  build-e2e-binary:
    name: Build binary for grouped E2E tests
    runs-on: [self-hosted, Linux, X64, stable]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659
        with:
          toolchain: stable
      - name: Check mongo2pg
        run: cargo check
      - name: Build mongo2pg
        run: cargo build --locked
      - name: Upload mongo2pg binary
        uses: actions/upload-artifact@v7
        with:
          name: mongo2pg-e2e-binary
          path: target/debug/mongo2pg
          if-no-files-found: error

  e2e-tests-offline:
    name: Run e2e offline tests for ${{ matrix.database_group }}
    needs: [prepare-matrix, build-e2e-binary]
    runs-on: [self-hosted, Linux, X64, stable]
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        database_group: ${{ fromJSON(needs.prepare-matrix.outputs.database_groups) }}

    services:
      postgres:
        image: postgis/postgis:16-3.4-alpine
        env:
          POSTGRES_USER: myuser
          POSTGRES_PASSWORD: x
          POSTGRES_DB: mydb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U myuser -d mydb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download binary built from this checkout
        if: ${{ inputs.release_tag == '' }}
        uses: actions/download-artifact@v8
        with:
          name: mongo2pg-e2e-binary
          path: target/debug
      - name: Make mongo2pg binary executable
        if: ${{ inputs.release_tag == '' }}
        run: chmod +x target/debug/mongo2pg

      - name: Install Task
        uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Ensure PostgreSQL client is available
        shell: bash
        run: |
          set -euo pipefail

          if command -v psql >/dev/null 2>&1; then
            echo "psql already available: $(psql --version)"
            exit 0
          fi

          echo "psql not found; attempting to install PostgreSQL client"

          can_run_privileged() {
            if [ "$(id -u)" -eq 0 ]; then
              return 0
            fi

            if command -v sudo >/dev/null 2>&1 && sudo -n true >/dev/null 2>&1; then
              return 0
            fi

            return 1
          }

          run_privileged() {
            if [ "$(id -u)" -eq 0 ]; then
              "$@"
              return
            fi

            if command -v sudo >/dev/null 2>&1; then
              if sudo -n true >/dev/null 2>&1; then
                sudo -n "$@"
                return
              fi
            fi

            echo "Cannot run privileged install command non-interactively: $*"
            echo "Runner must be root or have passwordless sudo configured."
            exit 1
          }

          install_via_package_manager() {
            if ! can_run_privileged; then
              echo "No root/passwordless sudo. Skipping package-manager install for psql."
              return 1
            fi

            if command -v apt-get >/dev/null 2>&1; then
              run_privileged apt-get update
              run_privileged apt-get install -y --no-install-recommends postgresql-client
            elif command -v dnf >/dev/null 2>&1; then
              run_privileged dnf install -y postgresql
            elif command -v yum >/dev/null 2>&1; then
              run_privileged yum install -y postgresql
            elif command -v apk >/dev/null 2>&1; then
              run_privileged apk add --no-cache postgresql-client
            else
              echo "No supported package manager found to install psql"
              return 1
            fi

            return 0
          }

          if ! install_via_package_manager; then
            echo "Falling back to docker-backed psql shim"

            if command -v docker >/dev/null 2>&1; then
              SHIM_BIN_DIR="$HOME/.local/bin"
              mkdir -p "${SHIM_BIN_DIR}"
              printf '%s\n' \
                '#!/usr/bin/env bash' \
                'set -euo pipefail' \
                'exec docker run --rm --network host -e PGPASSWORD="${PGPASSWORD:-}" postgres:16-alpine psql "$@"' \
                > "${SHIM_BIN_DIR}/psql"
              chmod +x "${SHIM_BIN_DIR}/psql"
              echo "${SHIM_BIN_DIR}" >> "$GITHUB_PATH"
              export PATH="${SHIM_BIN_DIR}:$PATH"
            else
              echo "docker unavailable; cannot provide psql fallback"
            fi
          fi

          command -v psql >/dev/null 2>&1 || {
            echo "psql still unavailable after installation attempt"
            exit 1
          }

          psql --version

      - name: Prepare mongo2pg binary from GitHub Release
        if: ${{ inputs.release_tag != '' }}
        run: |
          set -euo pipefail

          if [ -x target/debug/mongo2pg ]; then
            target/debug/mongo2pg --version
            exit 0
          fi

          REQUESTED_RELEASE_TAG="${{ inputs.release_tag || github.event.inputs.release_tag || '' }}"
          if [ -n "${REQUESTED_RELEASE_TAG}" ]; then
            RELEASE_TAG="${REQUESTED_RELEASE_TAG}"
            RELEASE_ENDPOINT="tags/${RELEASE_TAG}"
          else
            RELEASE_TAG="latest"
            RELEASE_ENDPOINT="latest"
          fi
          CUSTOM_RELEASE_TAG_REQUIRED=false
          if [ -n "${REQUESTED_RELEASE_TAG}" ]; then
            CUSTOM_RELEASE_TAG_REQUIRED=true
          fi

          echo "Using mongo2pg release tag: ${RELEASE_TAG}"

          DOWNLOAD_DIR=/tmp/mongo2pg-release-bin
          ASSET_NAME=mongo2pg-linux-x86_64.tar.gz
          mkdir -p "${DOWNLOAD_DIR}"

          release_exists() {
            local api_url http_code
            api_url="https://api.github.com/repos/${{ github.repository }}/releases/${RELEASE_ENDPOINT}"
            http_code="$(curl -sS -o /dev/null -w "%{http_code}" \
              -H "Authorization: Bearer ${{ github.token }}" \
              -H "Accept: application/vnd.github+json" \
              "${api_url}" || echo 000)"
            [ "${http_code}" = "200" ]
          }

          fallback_to_local_build() {
            echo "Release tag '${RELEASE_TAG}' not available. Falling back to local cargo build."
            if ! command -v cargo >/dev/null 2>&1; then
              echo "cargo not found; bootstrapping Rust toolchain for fallback build"
              curl -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
              export PATH="$HOME/.cargo/bin:$PATH"
            fi

            if ! command -v cargo >/dev/null 2>&1; then
              echo "cargo still unavailable after rustup bootstrap"
              exit 1
            fi

            cargo build
            target/debug/mongo2pg --version
          }

          download_with_gh() {
            command -v gh >/dev/null 2>&1 || return 1
            if [ "${RELEASE_TAG}" = "latest" ]; then
              gh release download \
                --repo "${{ github.repository }}" \
                --pattern "${ASSET_NAME}" \
                --dir "${DOWNLOAD_DIR}"
            else
              gh release download "${RELEASE_TAG}" \
                --repo "${{ github.repository }}" \
                --pattern "${ASSET_NAME}" \
                --dir "${DOWNLOAD_DIR}"
            fi
          }

          download_with_api() {
            local api_url asset_url release_json
            api_url="https://api.github.com/repos/${{ github.repository }}/releases/${RELEASE_ENDPOINT}"

            release_json="$(curl -fsSL \
              -H "Authorization: Bearer ${{ github.token }}" \
              -H "Accept: application/vnd.github+json" \
              "${api_url}")"

            if command -v jq >/dev/null 2>&1; then
              asset_url="$(printf '%s' "${release_json}" | jq -r --arg asset "${ASSET_NAME}" '.assets[] | select(.name == $asset) | .url' || true)"
            else
              asset_url="$(printf '%s' "${release_json}" | tr -d '\n' | sed -n 's/.*"name"[[:space:]]*:[[:space:]]*"'"${ASSET_NAME}"'"[^}]*"url"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p')"
            fi

            if [ -z "${asset_url}" ] || [ "${asset_url}" = "null" ]; then
              return 1
            fi

            curl -fsSL \
              -H "Authorization: Bearer ${{ github.token }}" \
              -H "Accept: application/octet-stream" \
              "${asset_url}" \
              -o "${DOWNLOAD_DIR}/${ASSET_NAME}"
          }

          if ! release_exists; then
            if [ "${CUSTOM_RELEASE_TAG_REQUIRED}" = true ]; then
              echo "Release tag '${RELEASE_TAG}' not found (explicit input)."
              exit 1
            fi
            fallback_to_local_build
            exit 0
          fi

          MAX_DOWNLOAD_ATTEMPTS=12
          RETRY_DELAY_SECONDS=10
          for i in $(seq 1 "${MAX_DOWNLOAD_ATTEMPTS}"); do
            if download_with_gh || download_with_api; then
              break
            fi
            if [ "$i" -eq "${MAX_DOWNLOAD_ATTEMPTS}" ]; then
              if [ "${CUSTOM_RELEASE_TAG_REQUIRED}" = true ]; then
                echo "Failed to download release asset for explicit tag ${RELEASE_TAG} after ${i} attempts"
                echo "Release assets currently published:"
                curl -fsSL -H "Authorization: Bearer ${{ github.token }}" -H "Accept: application/vnd.github+json" \
                  "https://api.github.com/repos/${{ github.repository }}/releases/${RELEASE_ENDPOINT}" \
                  | jq -r '.assets[]?.name' 2>/dev/null || true
                exit 1
              fi
              fallback_to_local_build
              exit 0
            fi
            echo "Waiting for release asset availability... (${i}/${MAX_DOWNLOAD_ATTEMPTS})"
            sleep "${RETRY_DELAY_SECONDS}"
          done

          mkdir -p target/debug
          tar -xzf "${DOWNLOAD_DIR}/${ASSET_NAME}" -C "${DOWNLOAD_DIR}"
          cp "${DOWNLOAD_DIR}/mongo2pg-linux-x86_64" target/debug/mongo2pg
          chmod +x target/debug/mongo2pg
          target/debug/mongo2pg --version

      - name: Start Docker services (MongoDB)
        run: |
          cd docker
          dc() { docker compose "$@"; }
          if ! docker compose version >/dev/null 2>&1; then
            dc() { docker-compose "$@"; }
          fi

          dc -f docker-compose.yml pull mongodb mongodb-init || true
          dc -f docker-compose.yml up -d mongodb mongodb-init

          # Wait for core services to be ready
          for service in mongodb:27017; do
            for i in {1..60}; do
              case $service in
                mongodb:27017)
                  if docker exec mongodb_db mongosh 'mongodb://user:pass@localhost:27017/admin?authSource=admin' --eval 'db.runCommand({ping: 1})' --quiet 2>/dev/null; then
                    echo "MongoDB is ready"
                    break
                  fi
                  ;;
              esac
              echo "Waiting for services... ($i/60)"
              sleep 5
            done
          done

          # Seed MongoDB with sample standard data
          DB_GROUP="${{ matrix.database_group }}"
          if [ "$(printf '%s' "${DB_GROUP}" | wc -w | xargs)" -eq 1 ] && printf '%s' "${DB_GROUP}" | grep -qw "sample_events"; then
            echo "Skipping mongodb-seed for sample_events (local e2e dataset only)"
          else
            MONGO_DATABASE="${DB_GROUP}" dc -f docker-compose.yml up mongodb-seed
          fi

          # Seed MongoDB with sample specific data
          MONGO_DATABASE="${DB_GROUP}" dc -f docker-compose.yml up mongodb-seed-e2e

      - name: Run mongo2pg grouped offline tests
        run: OFFLINE_ONLY=true task tests-all-grouped -- ${{ matrix.database_group }}

      - name: Upload post-import report artifact on failure
        if: failure()
        id: upload_post_report_artifact
        uses: actions/upload-artifact@v7
        with:
          name: offline-post-import-report-${{ matrix.database_group }}
          path: |
            results/**/reports/post_report*.html
            results/**/reports/post_reports.html
            results/**/reports/main.html
          if-no-files-found: warn

      - name: Print post-import report artifact link
        if: failure() && steps.upload_post_report_artifact.outputs.artifact-id != ''
        run: |
          URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts/${{ steps.upload_post_report_artifact.outputs.artifact-id }}"
          echo "Offline post-import report artifact for ${{ matrix.database_group }}: $URL"
          echo "Offline post-import report artifact for ${{ matrix.database_group }}: $URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup
        if: always()
        run: |
          cd docker
          dc() { docker compose "$@"; }
          if ! docker compose version >/dev/null 2>&1; then
            dc() { docker-compose "$@"; }
          fi
          dc -f docker-compose.yml down -v || true

  e2e-tests-online:
    name: Run e2e online tests for ${{ matrix.database_group }}
    needs: [prepare-matrix, build-e2e-binary]
    runs-on: [self-hosted, Linux, X64, stable]
