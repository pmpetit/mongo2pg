                echo "Failed to download release asset for explicit tag ${RELEASE_TAG} after ${i} attempts"
                echo "Release assets currently published:"
                curl -fsSL -H "Authorization: Bearer ${{ github.token }}" -H "Accept: application/vnd.github+json" \
                  "https://api.github.com/repos/${{ github.repository }}/releases/${RELEASE_ENDPOINT}" \
                  | jq -r '.assets[]?.name' 2>/dev/null || true
                exit 1
              fi
              fallback_to_local_build
              exit 0
            fi
            echo "Waiting for release asset availability... (${i}/${MAX_DOWNLOAD_ATTEMPTS})"
            sleep "${RETRY_DELAY_SECONDS}"
          done

          mkdir -p target/debug
          tar -xzf "${DOWNLOAD_DIR}/${ASSET_NAME}" -C "${DOWNLOAD_DIR}"
          cp "${DOWNLOAD_DIR}/mongo2pg-linux-x86_64" target/debug/mongo2pg
          chmod +x target/debug/mongo2pg
          target/debug/mongo2pg --version

