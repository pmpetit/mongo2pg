              return 0
            fi

            if command -v sudo >/dev/null 2>&1 && sudo -n true >/dev/null 2>&1; then
              return 0
            fi

            return 1
          }

          run_privileged() {
            if [ "$(id -u)" -eq 0 ]; then
              "$@"
              return
