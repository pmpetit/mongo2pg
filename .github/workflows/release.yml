name: Release

permissions:
    contents: write
    packages: write
    id-token: write
    actions: read

on:
    workflow_dispatch:
        inputs:
            version:
                description: Release version to publish (semver, e.g. 0.8.7)
                required: true
                type: string
    pull_request:
        types: [closed]
        branches:
            - "main"

concurrency:
    group: release-${{ github.event.pull_request.number || github.run_id }}
    cancel-in-progress: true

jobs:
    resolve_release_version:
        if: "${{ (github.event_name == 'workflow_dispatch' && inputs.version != '') || (github.event_name == 'pull_request' && github.event.pull_request.merged == true && (startsWith(github.event.pull_request.head.ref, 'release/') || startsWith(github.event.pull_request.title, 'chore: release '))) }}"
        runs-on: ubuntu-latest
        outputs:
            tag: ${{ steps.resolve.outputs.tag }}
        steps:
            - id: resolve
              shell: bash
              env:
                  PR_TITLE: ${{ github.event.pull_request.title }}
                  HEAD_REF: ${{ github.event.pull_request.head.ref }}
                  RELEASE_VERSION: ${{ inputs.version }}
              run: |
                  set -euo pipefail

                  semver_capture='([0-9]+\.[0-9]+\.[0-9]+)'
                  version=""
                  if [[ -n "${RELEASE_VERSION:-}" ]]; then
                      if [[ "$RELEASE_VERSION" =~ ^v?$semver_capture$ ]]; then
                          version="${BASH_REMATCH[1]}"
                      fi
                  elif [[ "$PR_TITLE" =~ ^chore:\ release\ $semver_capture$ ]]; then
                      version="${BASH_REMATCH[1]}"
                  elif [[ "$HEAD_REF" =~ ^release/$semver_capture$ ]]; then
                      version="${BASH_REMATCH[1]}"
                  fi

                  if [ -z "$version" ]; then
                      echo "Unable to resolve release version from PR title '$PR_TITLE' or branch '$HEAD_REF'." >&2
                      exit 1
                  fi

                  if [[ ! "$version" =~ ^$semver_capture$ ]]; then
                      echo "Resolved version '$version' is invalid. Expected strict semver x.y.z (digits only)." >&2
                      exit 1
                  fi

                  echo "tag=v$version" >> "$GITHUB_OUTPUT"

    production_image:
        if: "${{ (github.event_name == 'workflow_dispatch' && inputs.version != '') || (github.event_name == 'pull_request' && github.event.pull_request.merged == true && (startsWith(github.event.pull_request.head.ref, 'release/') || startsWith(github.event.pull_request.title, 'chore: release '))) }}"
        needs: [resolve_release_version]
        uses: ./.github/workflows/publish-image.yml
        with:
            image_tag: ${{ needs.resolve_release_version.outputs.tag }}

    build-binaries:
        if: "${{ (github.event_name == 'workflow_dispatch' && inputs.version != '') || (github.event_name == 'pull_request' && github.event.pull_request.merged == true && (startsWith(github.event.pull_request.head.ref, 'release/') || startsWith(github.event.pull_request.title, 'chore: release '))) }}"
        needs: [resolve_release_version]
        name: Build ${{ matrix.target }}
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - os: [ubuntu-latest]
                      target: x86_64-unknown-linux-gnu
                      artifact: mongo2pg-linux-x86_64
                    - os: [self-hosted, Linux, ARM64, stable]
                      target: aarch64-unknown-linux-gnu
                      artifact: mongo2pg-linux-aarch64
                    - os: macos-26-intel
                      target: x86_64-apple-darwin
                      artifact: mongo2pg-macos-x86_64
                    - os: macos-latest
                      target: aarch64-apple-darwin
                      artifact: mongo2pg-macos-aarch64
        steps:
            - uses: actions/checkout@v7
            - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659
              with:
                  toolchain: stable
                  target: ${{ matrix.target }}
            - name: Test and build
              shell: bash
              run: |
                  set -euo pipefail
                  # Tests already ran before opening/merging the release PR; avoid rerunning here.
                  cargo check
                  cargo build --release --locked --target "${{ matrix.target }}"
            - name: Package binaries
              shell: bash
              run: |
                  set -euo pipefail
                  mkdir -p dist
                  cp "target/${{ matrix.target }}/release/mongo2pg" "dist/${{ matrix.artifact }}"
                  chmod +x "dist/${{ matrix.artifact }}"
                  sha256sum "dist/${{ matrix.artifact }}" > "dist/${{ matrix.artifact }}.sha256"
                  tar -C dist -czf "dist/${{ matrix.artifact }}.tar.gz" "${{ matrix.artifact }}" "${{ matrix.artifact }}.sha256"
            - uses: actions/upload-artifact@v7
              with:
                  name: mongo2pg-binaries-${{ matrix.artifact }}
                  path: |
                      dist/*.tar.gz
                      dist/*.sha256
                  if-no-files-found: error

    publish-github-release:
        if: "${{ (github.event_name == 'workflow_dispatch' && inputs.version != '') || (github.event_name == 'pull_request' && github.event.pull_request.merged == true && (startsWith(github.event.pull_request.head.ref, 'release/') || startsWith(github.event.pull_request.title, 'chore: release '))) }}"
        needs: [resolve_release_version, build-binaries]
        runs-on: ubuntu-latest
        steps:
            - name: Download binary artifacts
              uses: actions/download-artifact@v8
              with:
                  pattern: mongo2pg-binaries-*
                  path: artifacts
                  merge-multiple: true

            - name: Validate release artifacts
              shell: bash
              run: |
                  set -euo pipefail
                  find artifacts -maxdepth 2 -type f -print
                  if ! find artifacts -maxdepth 2 -type f -name '*.tar.gz' -print -quit | grep -q .; then
                      echo "No .tar.gz binary archives found to publish"
                      exit 1
                  fi
                  if ! find artifacts -maxdepth 2 -type f -name '*.sha256' -print -quit | grep -q .; then
                      echo "No .sha256 checksum files found to publish"
                      exit 1
                  fi

            - name: Create or update GitHub Release with binaries
              uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228
              with:
                  tag_name: ${{ needs.resolve_release_version.outputs.tag }}
                  name: ${{ needs.resolve_release_version.outputs.tag }}
                  target_commitish: ${{ github.sha }}
                  prerelease: false
                  make_latest: true
                  generate_release_notes: true
                  files: |
                      artifacts/*.tar.gz
                      artifacts/*.sha256
                  fail_on_unmatched_files: true
    cleanup_non_semver_images:
        name: Remove non-SemVer container images
        needs: [production_image, publish-github-release]
        runs-on: ubuntu-latest
        steps:
            - name: Delete GHCR versions without SemVer tags
              uses: actions/github-script@v9
              with:
                  script: |
                                            const { owner, repo } = context.repo;
                                            const { data: repository } = await github.rest.repos.get({ owner, repo });
                                            const packageName = repo.toLowerCase();
                                            const packageParams = { package_type: 'container', package_name: packageName, per_page: 100 };
                                            const isOrganization = repository.owner.type === 'Organization';
                                            const getVersions = isOrganization
                                                ? github.rest.packages.getAllPackageVersionsForOrg
                                                : github.rest.packages.getAllPackageVersionsForUser;
                                            const ownerParams = isOrganization ? { org: owner } : { username: owner };
                                            const versions = await github.paginate(getVersions, { ...ownerParams, ...packageParams });
                                            const semverTag = /^v?(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(?:-(?:0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*)(?:\.(?:0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*))*)?(?:\+[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?$/;

                                            for (const version of versions) {
                                                const tags = version.metadata?.container?.tags ?? [];
                                                const semanticTags = tags.filter((tag) => semverTag.test(tag));
                                                if (semanticTags.length > 0) {
                                                    core.info(`Keeping package version ${version.id}; SemVer tags: ${semanticTags.join(', ')}`);
                                                    continue;
                                                }

                                                core.info(`Deleting package version ${version.id}; non-SemVer tags: ${tags.join(', ') || '<untagged>'}`);
                                                const deleteParams = {
                                                    package_type: 'container',
                                                    package_name: packageName,
                                                    package_version_id: version.id,
                                                };
                                                if (isOrganization) {
                                                    await github.rest.packages.deletePackageVersionForOrg({ org: owner, ...deleteParams });
                                                } else {
                                                    await github.rest.packages.deletePackageVersionForUser({ username: owner, ...deleteParams });
                                                }
                                            }
