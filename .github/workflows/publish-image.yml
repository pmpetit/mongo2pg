name: Publish image to GHCR

on:
    workflow_call:
        inputs:
            image_tag:
                description: Tag to publish for the repository image
                required: true
                type: string

permissions:
    contents: read
    packages: write

jobs:
    build:
        strategy:
            fail-fast: false
            matrix:
                include:
                    - platform: linux/amd64
                      runner: ubuntu-24.04
                      suffix: linux-amd64
                    - platform: linux/arm64
                      runner: ubuntu-24.04-arm
                      suffix: linux-arm64
        runs-on: ${{ matrix.runner }}
        steps:
            - uses: actions/checkout@v7

            - uses: docker/setup-buildx-action@v4

            - name: Log in to GitHub Container Registry
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Normalize image name
              id: image
              shell: bash
              run: |
                  image="ghcr.io/$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
                  echo "name=$image" >> "$GITHUB_OUTPUT"

            - name: Build and push image by digest
              id: build
              uses: docker/build-push-action@v7
              with:
                  context: .
                  file: ./Dockerfile
                  platforms: ${{ matrix.platform }}
                  outputs: type=image,name=${{ steps.image.outputs.name }},push-by-digest=true,name-canonical=true,push=true
                  cache-from: type=gha,scope=${{ matrix.suffix }}
                  cache-to: type=gha,mode=max,scope=${{ matrix.suffix }}

            - name: Export digest
              shell: bash
              run: |
                  mkdir -p /tmp/digests
                  digest="${{ steps.build.outputs.digest }}"
                  touch "/tmp/digests/${digest#sha256:}"

            - name: Upload digest
              uses: actions/upload-artifact@v7
              with:
                  name: digests-${{ matrix.suffix }}
                  path: /tmp/digests/*
                  if-no-files-found: error
                  retention-days: 1

    merge:
        needs: build
        runs-on: ubuntu-24.04
        steps:
            - uses: docker/setup-buildx-action@v4

            - name: Download digests
              uses: actions/download-artifact@v8
              with:
                  pattern: digests-*
                  path: /tmp/digests
                  merge-multiple: true

            - name: Log in to GitHub Container Registry
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Normalize image name
              id: image
              shell: bash
              run: |
                  image="ghcr.io/$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
                  echo "name=$image" >> "$GITHUB_OUTPUT"

            - name: Create multi-platform manifest
              shell: bash
              working-directory: /tmp/digests
              run: |
                  refs=()
                  for digest in *; do
                      refs+=("${{ steps.image.outputs.name }}@sha256:${digest}")
                  done
                  docker buildx imagetools create -t "${{ steps.image.outputs.name }}:${{ inputs.image_tag }}" "${refs[@]}"

            - name: Inspect published manifest
              shell: bash
              run: docker buildx imagetools inspect "${{ steps.image.outputs.name }}:${{ inputs.image_tag }}"
